<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="d-flex flex-column min-vh-100">
    
    <header>
      <nav class="navbar bg-1 fg-2">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDVvxdrfeQALFaLhcJ_ZQ-fkkpVlxJ8nbIqEXLNT1t2qeWhLLwMJx_TocT&s=10"
              alt="Logo"
              width="80"
              height="70"
            />
            Mercado Grassi
          </a>
          <button class="btn-solid btn-styled theme-info">
            Faça seu Login
          </button>
        </div>
      </nav>
    </header>

    <main class="container mt-5 flex-grow-1 align-itens-center">
      <div
        class="d-flex justify-content-center mt-1"
      >
        <div class="menu show" style="--bs-menu-min-width: 300px">
          <form class="d-flex flex-column gap-5 p-5">
            <div>
              <label for="exampleMenuFormEmail1" class="form-label"
                >Email</label
              >
              <input
                type="email"
                class="form-control"
                id="exampleMenuFormEmail1"
                placeholder="email@exemplo.com"
              />
            </div>
            <div>
              <label for="exampleMenuFormPassword1" class="form-label"
                >Senha</label
              >
              <input
                type="password"
                class="form-control"
                id="exampleMenuFormPassword1"
                placeholder="Senha123"
              />
            </div>
            <div class="form-field">
              <input type="checkbox" id="checkLabel" class="check" />
              <label for="checkLabel">Manter Conectado?</label>
            </div>
            <div class="vstack gap-2">
              <a href="./client/PRODUTOS/produtos.html">
                <button type="button" class="btn-solid theme-primary">
                  Fazer Login
                </button>
              </a>
              <a class="theme-secondary" href="#"
                >Novo por aqui? Consulte os administradores para mais
                informações</a
              >
              <a class="theme-secondary" href="#">Esqueceu a senha?</a>
            </div>
          </form>
        </div>
      </div>
    </main>

      <footer class="py-3 my-4">
        <ul class="nav justify-content-center border-bottom pb-3 mb-3">
          <li class="nav-item">
            <a href="#" class="nav-link px-2 text-body-secondary">Home</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link px-2 text-body-secondary">Features</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link px-2 text-body-secondary">Pricing</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link px-2 text-body-secondary">FAQs</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link px-2 text-body-secondary">About</a>
          </li>
        </ul>
        <p class="text-center text-body-secondary">© 2025 Company, Inc</p>
      </footer>
  </body>
</html>
